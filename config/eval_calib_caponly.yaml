inherit: "config/eval_calib.yaml"

# Ablation: cap only (linear weighted avg, raw c weight, with cap).
# Isolates the effect of freeze prevention vs vanilla's unbounded accumulator.
tracking:
  filtering_mode: weighted_pointmap_linear
  fusion:
    w_exp: 1.0     # raw c (same as vanilla)
    cap: 200.0     # typical c ≈ 8 ⇒ effective fusion window ≈ 25 obs
