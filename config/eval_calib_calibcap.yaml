inherit: "config/eval_calib.yaml"

# Ablation: calibration + cap (linear weighted avg, c^0.74 weight, with cap).
# Cap scaled to match the same effective fusion window as `caponly` (≈ 25 obs):
#   typical c ≈ 8  ⇒  typical c^0.74 ≈ 4.7  ⇒  cap ≈ 25 · 4.7 ≈ 120
# without this scaling, calibcap would silently have a larger effective N
# than caponly (cap=200/4.7 ≈ 42) and the ablation would conflate two effects.
tracking:
  filtering_mode: weighted_pointmap_linear
  fusion:
    w_exp: 0.74
    cap: 120.0    # ≈ same effective N≈25 as caponly's cap=200
