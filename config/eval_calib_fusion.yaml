inherit: "config/eval_calib.yaml"

# Phase 1+2: per-pixel Kalman with calibrated obs variance + process noise.
# The process noise (forget_factor < 1) is what makes this genuinely
# different from the linear cap+calib form — it actively decays the prior's
# certainty each step, letting old (possibly wrong) observations fade
# naturally without any explicit reset / threshold tuning.
tracking:
  filtering_mode: weighted_pointmap_kalman
  fusion:
    sigma_a: 0.708         # cross-scene σ ≈ a · c^p fit
    sigma_p: -0.372        # cross-scene σ ≈ a · c^p fit
    forget_factor: 0.95    # λ; σ² ← σ²/λ per step. effective window ≈ 1/(1−λ) = 20
    sigma2_floor: 0.0      # optional; usually unnecessary with forget_factor < 1
