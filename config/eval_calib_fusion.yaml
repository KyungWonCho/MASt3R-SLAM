inherit: "config/eval_calib.yaml"

# Per-pixel scalar Kalman fusion with calibrated noise model and
# Mahalanobis-gated variance inflation. See notes/diag_findings.md.
tracking:
  filtering_mode: weighted_pointmap_calib
  fusion:
    sigma_a: 0.708        # calibrated from cross-scene σ ≈ a · c^p (§2)
    sigma_p: -0.372       # cross-scene fit (3243 pairs, 552M pixel obs)
    sigma2_floor: 5e-3    # lower bound on σ²_canon; prevents freeze
                          # (≈ effective N cap of ~20 for typical c)
    mahala2_thresh: 9.0   # χ²(3) 97 %ile — gate fires on the rarest 3 % of innov
                          # under the noise model
    inflation: 4.0        # σ²_canon ×= 4 when gate fires ⇒ next Kalman gain
                          # ≈ 4× larger ⇒ "fast correction of early-wrong"
