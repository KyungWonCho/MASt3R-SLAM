inherit: "config/eval_calib.yaml"

# Ablation: calibration only (linear weighted avg, c^0.74 weight, no cap).
# Isolates the effect of the calibrated weight exponent vs vanilla's raw c.
tracking:
  filtering_mode: weighted_pointmap_linear
  fusion:
    w_exp: 0.74   # calibrated from cross-scene σ ≈ a·c^p, p ≈ -0.37
    cap: 0        # 0 = no cap (matches vanilla's unbounded accumulator)
